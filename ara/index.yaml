# nio.log — Research Artifacts Index

> Three projects, one ARA protocol. Typed dependencies between projects.

## Projects

| ID | Name | Core Question | Status | Entry |
|----|------|--------------|--------|-------|
| **M0** | TreeHeap Math | TreeHeap 能否先成为数学闭包工具箱？ | 🔄 Active | `ara/m0-treeheap-math/` |
| **S1** | Echo | 语义前缀路由能否替代稠密输出层？ | ✅ Baseline | `ara/s1-echo/` |
| **S2** | Translation | 折叠栈能否替代 Transformer 注意力搜索？ | 🔄 Active | `ara/s2-translation/` |
| **S3** | Generation | TreeHeap 能否驱动可控文本生成？ | 📋 Planned | `ara/s3-generation/` |

## Dependency Graph

```
M0 (TreeHeap Math)
  │
  └──→ S1/S2
        先验证 compose/decompose/transpose/match_subheap 等数学算子
        再进入 Echo、结构不变量和翻译任务

S1 (Echo)
  │
  ├──→ S2 (Translation)
  │     L0/L1 语义架构来自 S1 的堆树设计
  │     Token 的 128D 路径向量 = S1 的 TreeHeap 输出
  │
  └──→ S3 (Generation)
        L1 语义坍缩 = S1 的多义消歧机制
        S2 的折叠结构 → S3 的生成器输入
```

