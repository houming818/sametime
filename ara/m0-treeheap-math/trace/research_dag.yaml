# M0 TreeHeap Math Research DAG

dag:
  root:
    type: question
    question: "Can TreeHeap be established as a mathematical operator space before language tasks?"
    reason: "Direct WMT/BLEU is too coarse to diagnose missing algebraic tools."

  p_math01:
    type: predict
    id: P-MATH01
    title: "Minimal TreeHeap algebra"
    source: "logic/predicts.md#P-MATH01"
    claim_if_passes: "TreeHeap has a synthetic operator toolbox worth testing with echo."
    evidence_gates:
      - E-MATH01
      - E-MATH02
      - E-MATH03
      - E-MATH04
      - E-MATH05
      - E-MATH06
    status: running

  experiment_treeheap_math_probe:
    type: experiment
    source: "src/treeheap_math_probe.py"
    evidence: "evidence/treeheap_math_probe/"
    parent: p_math01
    status: executed
    result: "pilot_pass=true after adding head_v root reference to the TreeHeap object"
    lesson: "A collapsed whole-vector is insufficient for exact transpose inverse; TreeHeap needs a root/head reference field."

  next_if_pass:
    type: decision
    condition: "P-MATH01 pilot passes"
    action: "Build M1/M2 echo tests on TreeHeap objects rather than raw token echo."

  next_if_fail:
    type: decision
    condition: "P-MATH01 pilot fails"
    action: "Revise algebra operators before touching echo or S2."

  p_math02:
    type: predict
    id: P-MATH02
    title: "Semantic primitive and plus operator"
    source: "logic/predicts.md#P-MATH02"
    parent: p_math01
    claim_if_passes: "Addressable TreeHeap can use plus as successor, information gain, and mod-fold operator in synthetic mode."
    evidence_gates:
      - E-MATH07
      - E-MATH08
      - E-MATH09
      - E-MATH10
    status: running

  experiment_primitive_plus_probe:
    type: experiment
    source: "src/primitive_plus_probe.py"
    evidence: "evidence/primitive_plus_probe/"
    parent: p_math02
    status: executed
    result: "pilot_pass=true; plus writes next address, increases information before base is full, and folds to arr[0]/arr[1] after base."
    lesson: "P-MATH02 should treat arr/address as primary state and summary as projection; plus can be tested before language."
